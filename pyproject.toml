[project]
name = "keel"
version = "0.1.0"
description = "Keel — FastAPI application scaffold with DRF-style ViewSets, SQLAlchemy and RBAC"
authors = [
    {name = "fzf", email = "fzf54122@163.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = [
    "fastapi", "keel", "scaffold", "rbac", "sqlalchemy", "alembic",
    "fast_generic_api", "jwt", "async", "postgresql",
]
dependencies = [
    "fast_generic_api",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic[email]>=2.0.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.0.0",
    "loguru>=0.7.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "redis>=4.5.0",
    "slowapi>=0.1.9",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
]
dev = [
    "ruff>=0.12.3",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/fzf54122/keel"
Repository = "https://github.com/fzf54122/keel.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["application", "common", "conf"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["application", "common", "conf"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.3",
    "pre-commit>=3.0.0",
]
